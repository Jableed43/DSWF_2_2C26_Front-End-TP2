<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgRocioFoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d1848" />
      <stop offset="100%" stop-color="#2d0d2a" />
    </linearGradient>
    <linearGradient id="skinRocio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0bd" />
      <stop offset="100%" stop-color="#f3c699" />
    </linearGradient>
    <linearGradient id="hairRocio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2511" />
      <stop offset="100%" stop-color="#2a1205" />
    </linearGradient>
    <linearGradient id="shirtRocio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b" />
      <stop offset="100%" stop-color="#7e2b76" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgRocioFoto)" />
  <!-- Hair back -->
  <path d="M60 85 C50 120 48 165 70 180 C80 180 120 180 130 180 C152 165 150 120 140 85 Z" fill="url(#hairRocio)" />
  <!-- Body / Torso -->
  <path d="M45 200 C45 155 75 145 100 145 C125 145 155 155 155 200 Z" fill="url(#shirtRocio)" />
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="26" rx="6" fill="#f3c699" />
  <!-- Head -->
  <ellipse cx="100" cy="95" rx="36" ry="42" fill="url(#skinRocio)" />
  <!-- Hair front -->
  <path d="M64 92 C60 62 82 50 100 50 C118 50 140 62 136 92 C132 80 125 72 108 72 C92 72 74 78 64 92 Z" fill="url(#hairRocio)" />
  <!-- Eyes -->
  <circle cx="86" cy="94" r="4.5" fill="#2d0d2a" />
  <circle cx="114" cy="94" r="4.5" fill="#2d0d2a" />
  <circle cx="88" cy="92" r="1.5" fill="#ffffff" />
  <circle cx="116" cy="92" r="1.5" fill="#ffffff" />
  <!-- Eyebrows -->
  <path d="M80 86 Q86 82 92 85" stroke="#2a1205" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M108 85 Q114 82 120 86" stroke="#2a1205" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Smile -->
  <path d="M92 114 Q100 122 108 114" stroke="#c2185b" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Blush -->
  <circle cx="78" cy="104" r="6" fill="#ff4081" opacity="0.3" />
  <circle cx="122" cy="104" r="6" fill="#ff4081" opacity="0.3" />
</svg>
